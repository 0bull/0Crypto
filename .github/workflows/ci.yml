name: CI

on:
  # Branch pushes run through their pull request; only main runs on push. One run per change, not two.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No secrets are used and nothing is deployed from CI. Every action is pinned by full commit SHA.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.2"
          tools: composer
      - name: Cache Hardhat's solc download
        # `npm run typecheck` and `contracts:test` compile the factory with solc 0.8.28, fetched on first use.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/hardhat-nodejs
          key: hardhat-solc-${{ runner.os }}-${{ hashFiles('hardhat.config.ts', 'package-lock.json') }}
      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('plugins/woocommerce/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (Workers pool and Node project)
        run: npm test
      - name: Contract tests (Hardhat)
        run: npm run contracts:test
      - name: WooCommerce plugin tests
        run: npm run test:woo

  deploy-config:
    # Builds the Worker exactly as `wrangler deploy` would, without logging in or uploading anything.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Heavy SDKs must not be in the Worker bundle
        # Matches package paths in the source map and import specifiers in the code, not bare words
        # ("ethers" alone also matches the "etherscan.io" explorer URLs, which are fine).
        run: |
          set -eu
          test -s dist/index.js
          test -s dist/index.js.map
          pkgs='(tronweb|ethers|@railgun-community)'
          if grep -rIE "node_modules/${pkgs}([/\"]|$)" dist/index.js.map \
            || grep -rIE "(from|require\(|import\()[[:space:]]*[\"']${pkgs}[/\"']" dist/index.js; then
            echo "::error::dist contains tronweb, ethers or @railgun-community (Node-only tools must never be bundled)"
            exit 1
          fi
          echo "bundle clean"

  site:
    # Builds and tests the docs site in site/. Build and test only: nothing is deployed and no secrets are used.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run
